minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^hl7-ai-competition/apple-healthkit-simulator/
      - id: ruff-format
        files: ^hl7-ai-competition/apple-healthkit-simulator/

  - repo: local
    hooks:
      - id: biome-format
        name: biome format (whatsapp-simulator)
        entry: bash -c 'cd hl7-ai-competition/whatsapp-simulator && bunx biome format --write .'
        language: system
        files: ^hl7-ai-competition/whatsapp-simulator/
        pass_filenames: false
      - id: knip
        name: knip (whatsapp-simulator)
        entry: bash -c 'cd hl7-ai-competition/whatsapp-simulator && bunx knip'
        language: system
        files: ^hl7-ai-competition/whatsapp-simulator/
        pass_filenames: false
      - id: bal-format
        name: bal format (care-loop-ai-service)
        entry: bash -c 'cd hl7-ai-competition/care-loop-ai-service && bal format'
        language: system
        files: ^hl7-ai-competition/care-loop-ai-service/.*\.bal$
        pass_filenames: false
      - id: bal-scan
        name: bal scan (care-loop-ai-service)
        entry: bash -c 'cd hl7-ai-competition/care-loop-ai-service && bal scan'
        language: system
        files: ^hl7-ai-competition/care-loop-ai-service/.*\.bal$
        pass_filenames: false

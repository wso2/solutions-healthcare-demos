services:
  apple-healthkit-simulator:
    build:
      context: ./apple-healthkit-simulator
    image: apple-healthkit-simulator:latest
    container_name: apple-healthkit-simulator
    ports:
      - "8000:8000"
    environment:
      HEALTHKIT_DATABASE_URL: "sqlite:///./data/healthkit.db"
    volumes:
      - healthkit-data:/app/data
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    develop:
      watch:
        - path: ./apple-healthkit-simulator/pyproject.toml
          action: rebuild
        - path: ./apple-healthkit-simulator/uv.lock
          action: rebuild
        - path: ./apple-healthkit-simulator/src
          action: rebuild

  whatsapp-simulator:
    build:
      context: ./whatsapp-simulator
    image: whatsapp-simulator:latest
    container_name: whatsapp-simulator
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    develop:
      watch:
        - path: ./whatsapp-simulator/package.json
          action: rebuild
        - path: ./whatsapp-simulator/bun.lock
          action: rebuild
        - path: ./whatsapp-simulator/next.config.ts
          action: rebuild
        - path: ./whatsapp-simulator/src
          action: rebuild

volumes:
  healthkit-data:

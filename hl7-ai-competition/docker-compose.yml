services:
  apple-healthkit-simulator:
    build:
      context: ./apple-healthkit-simulator
    image: apple-healthkit-simulator:latest
    container_name: apple-healthkit-simulator
    ports:
      - "8000:8000"
    environment:
      HEALTHKIT_DATABASE_URL: "sqlite:///./data/healthkit.db"
    volumes:
      - healthkit-data:/app/data
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    develop:
      watch:
        - path: ./apple-healthkit-simulator/pyproject.toml
          action: rebuild
        - path: ./apple-healthkit-simulator/uv.lock
          action: rebuild
        - path: ./apple-healthkit-simulator/src
          action: rebuild

  whatsapp-simulator:
    build:
      context: ./whatsapp-simulator
    image: whatsapp-simulator:latest
    container_name: whatsapp-simulator
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    develop:
      watch:
        - path: ./whatsapp-simulator/package.json
          action: rebuild
        - path: ./whatsapp-simulator/bun.lock
          action: rebuild
        - path: ./whatsapp-simulator/next.config.ts
          action: rebuild
        - path: ./whatsapp-simulator/src
          action: rebuild

  openemr-db:
    image: mysql:8.4
    container_name: openemr-db
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - openemr-db:/var/lib/mysql
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "localhost"
        - "-proot"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  openemr:
    image: openemr/openemr:8.0.0.3
    container_name: openemr
    ports:
      - "3001:80"
    environment:
      MYSQL_HOST: openemr-db
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
      # Enable REST + FHIR APIs and password grant on first setup (OpenEMR
      # globals applied via OPENEMR_SETTING_<global>).
      OPENEMR_SETTING_rest_api: 1
      OPENEMR_SETTING_rest_fhir_api: 1
      OPENEMR_SETTING_site_addr_oath: "http://localhost"
      OPENEMR_SETTING_oauth_password_grant: 1
    volumes:
      - openemr-sites:/var/www/localhost/htdocs/openemr/sites
    depends_on:
      openemr-db:
        condition: service_healthy
    restart: unless-stopped

  # FHIR R4 -> MCP bridge in front of OpenEMR. Behind the "fhir" profile so it
  # starts only after bootstrap-fhir.sh mints a token. Uses internal plain HTTP:
  # the client verifies TLS with no skip option, so HTTP sidesteps OpenEMR's
  # self-signed cert; the bearer token is still required.
  fhir-mcp-server:
    # Built from the pinned upstream tag rather than the published image, which
    # is arm64-only; building uses $TARGETPLATFORM so it works on any host arch.
    build:
      context: "https://github.com/wso2/fhir-mcp-server.git#0.10.0"
    image: care-loop/fhir-mcp-server:0.10.0
    container_name: fhir-mcp-server
    profiles:
      - fhir
    ports:
      - "8001:8000"
    environment:
      FHIR_MCP_HOST: 0.0.0.0
      FHIR_MCP_PORT: 8000
      FHIR_SERVER_BASE_URL: "http://openemr/apis/default/fhir"
      # Static token mode (demo): bearer token from .fhir.env (TTL widened by
      # bootstrap). Future: SMART auth-code grant so the server self-refreshes.
      FHIR_SERVER_DISABLE_AUTHORIZATION: "True"
    env_file:
      - path: .fhir.env
        required: false
    depends_on:
      - openemr
    restart: unless-stopped

volumes:
  healthkit-data:
  openemr-db:
  openemr-sites:

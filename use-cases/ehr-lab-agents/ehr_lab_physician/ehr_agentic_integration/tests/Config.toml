# Test configuration: the compose stack's Postgres and FHIR servers on their host ports, and an
# in-memory workflow engine so tests need no Temporal server. (scripts/utils/bal.sh overrides the hosts
# when tests run inside the Ballerina container.)
dbHost = "localhost"
dbPort = 5433
labFhirBaseUrl = "http://localhost:8082/fhir/r4"
toxiproxyUrl = "http://localhost:8474"

labMcpServerUrl = "http://localhost:8011/mcp/"

[[ehrSystems]]

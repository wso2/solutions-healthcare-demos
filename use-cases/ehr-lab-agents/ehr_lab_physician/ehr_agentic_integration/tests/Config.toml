# Test configuration: the compose stack's Postgres and FHIR servers on their host ports, and an
# in-memory workflow engine so tests need no Temporal server. (scripts/bal.sh overrides the hosts
# when tests run inside the Ballerina container.)
dbHost = "localhost"
dbPort = 5433
labFhirBaseUrl = "http://localhost:8082/fhir/r4"
apiPort = 19090
toxiproxyUrl = "http://localhost:8474"

[[ehrSystems]]
id = "cerner"
displayName = "Oracle Health (Cerner)"
vendor = "cerner"
fhirBaseUrl = "http://localhost:8081/fhir/r4"
mcpServerUrl = "http://localhost:8010/mcp/"
mrnSystem = "urn:oid:2.16.840.1.113883.3.787.0.0"
outageProxy = "cerner"

[[ehrSystems]]
id = "athena"
displayName = "athenahealth"
vendor = "athena"
fhirBaseUrl = "http://localhost:8083/fhir/r4"
mcpServerUrl = "http://localhost:8011/mcp/"
mrnSystem = "urn:demo:athenahealth:mrn"
outageProxy = "athena"

[ballerina.workflow]
mode = "IN_MEMORY"

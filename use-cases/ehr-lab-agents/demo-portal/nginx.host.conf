# nginx.conf for host mode (docker-compose.host.yml): the integration and the lab simulator run on the Mac,
# which the container reaches as host.docker.internal. The address never changes, so no resolver is needed.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://host.docker.internal:9090;
    proxy_read_timeout 120s;
  }
  location /lab-api/ {
    rewrite ^/lab-api/(.*)$ /lab/$1 break;
    proxy_pass http://host.docker.internal:9093;
  }

  # The patient app's mode and SMART settings (config/patient-auth.json, mounted by docker-compose.yml): never
  # cached, so scripts/patient-app-mode.sh takes effect on the next page load.
  location = /patient-auth.json {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri /index.html;
  }
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Same routes the Vite dev server proxies (vite.config.ts).
  location /api/ {
    proxy_pass http://integration:9090;
    proxy_read_timeout 120s;
  }
  location /lab-api/ {
    proxy_pass http://lab-simulator:9093/lab/;
  }

  # Single-page app: unknown paths serve index.html.
  location / {
    try_files $uri /index.html;
  }
}

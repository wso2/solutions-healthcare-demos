server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve upstreams through Docker's DNS on each request (cached 10 s): a recreated container gets a new
  # address, and a name resolved once at startup would leave the portal answering 502 until it restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Same routes the Vite dev server proxies (vite.config.ts).
  location /api/ {
    set $integration http://integration:9090;
    proxy_pass $integration;
    proxy_read_timeout 120s;
  }
  location /lab-api/ {
    set $lab http://lab-simulator:9093;
    rewrite ^/lab-api/(.*)$ /lab/$1 break;
    proxy_pass $lab;
  }

  # The patient app's mode and SMART settings (config/patient-auth.json, mounted by docker-compose.yml): never
  # cached, so scripts/utils/patient-app-mode.sh takes effect on the next page load.
  location = /patient-auth.json {
    add_header Cache-Control "no-store";
  }

  # Single-page app: unknown paths serve index.html.
  location / {
    try_files $uri /index.html;
  }
}

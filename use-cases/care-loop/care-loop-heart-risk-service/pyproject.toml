[project]
name = "care-loop-heart-risk-service"
version = "0.1.0"
description = "Serves heart-disease risk predictions from Apple Watch / HealthKit signals via an exported ONNX model."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]
# Heavy training-only stack, kept out of the serving image.
train = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "joblib>=1.4",
    "onnx>=1.17",
    "skl2onnx>=1.18",
    "onnxmltools>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
